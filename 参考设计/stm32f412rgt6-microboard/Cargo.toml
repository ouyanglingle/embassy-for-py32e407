[package]
name = "miniboard"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32f412rg",
    "unstable-pac",
    "memory-x",
    "time-driver-any",
    "exti",
] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-futures = { version = "0.1.2" }
defmt = { version = "1.0.1", default-features = false }
# defmt-rtt = { version = "1.0.0", default-features = false }

cortex-m-rt = "0.7.5"
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }

embedded-hal = "1.0.0"
embedded-hal-bus = { version = "0.3", features = ["async"] }
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9.2", default-features = false }

static_cell = "2.1.1"
stm32-metapac = { version = "20.0.0", features = ["stm32f412rg"] }
arraydeque = { version = "0.5.1", default-features = false }
critical-section = { version = "1.2.0", default-features = false }
defmt-rtt = "1.2.0"
micromath = "2.1.0"


# chrono = { version = "^0.4", default-features = false}

[profile.dev]
lto = "thin"
debug = true
codegen-units = 1
opt-level = 3

[profile.release]
debug = true
opt-level = "s"   # 优化级别：0=无优化，1=基本优化，2=默认优化，3=最大优化，"s"=体积优化，"z"=极限体积优化
lto = "fat"       # 链接时优化：false=关闭，true=全 LTO，"thin"=轻量 LTO
codegen-units = 1 # 代码生成单元数：1=最优优化（禁用并行），>1=加快编译速度但降低优化效果
