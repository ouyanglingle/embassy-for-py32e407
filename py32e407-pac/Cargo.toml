[package]
name = "py32e407-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral Access Crate (PAC) for Puya PY32E407 series microcontrollers (Cortex-M4), generated from PY32E407xx.svd with svd2rust 0.37.1"
license = "MIT OR Apache-2.0"
keywords = ["py32", "puya", "pac", "embedded", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
readme = "README.md"

[dependencies]
cortex-m = "0.7.7"
vcell = "0.1.3"
cortex-m-rt = { version = "0.7.5", optional = true }
critical-section = { version = "1.1", optional = true }

[features]
# 启用中断向量表（__INTERRUPTS）与 cortex-m-rt 支持
# device：告知 cortex-m-rt 由本 PAC 的 device.x 提供中断向量表，避免其兜底 __INTERRUPTS 重复定义
rt = ["dep:cortex-m-rt", "cortex-m-rt?/device"]
# 启用 Peripherals::take() 的 critical-section 保护版本
critical-section = ["dep:critical-section"]

[package.metadata.docs.rs]
features = ["rt"]
default-target = "thumbv7em-none-eabi"

[profile.release]
debug = true
lto = true
